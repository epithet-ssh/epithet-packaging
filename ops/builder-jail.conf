# Merge these parameters into the builder's jail.conf stanza, including when
# using Bastille. This is a privilege fragment, not a complete network config.
# Create a VNET jail with outbound connectivity and its own loopback interface.
children.max = 16;
enforce_statfs = 1;
# Poudriere must mount filesystems inside its child jails.
securelevel = -1;
allow.mount;
allow.mount.devfs;
allow.mount.nullfs;
allow.mount.tmpfs;
allow.raw_sockets;
allow.socket_af;
allow.chflags;
# Poudriere requests locked-memory support when creating every child jail.
allow.mlock;
sysvmsg = new;
sysvsem = new;
sysvshm = new;
# Keep the jail manager's mount.devfs and devfs ruleset. No ZFS device or pool
# delegation is needed with this repository's NO_ZFS poudriere configuration.
