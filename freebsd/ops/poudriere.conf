# Installed as /usr/local/etc/poudriere.d/poudriere.conf inside the privileged builder jail.
# Directory-backed storage keeps pool delegation out of the builder jail.
NO_ZFS=yes
USE_TMPFS=yes
USE_PROCFS=no
USE_FDESCFS=no
# Native Go builds need no Linux emulation mounts inside the builder jail.
NOLINUX=yes
# SSH integration tests need a login shell; the default nobody uses nologin.
# Create the matching account in the builder; Poudriere creates it in child jails.
PORTBUILD_USER=builder
PORTBUILD_GROUP=builder
PORTBUILD_UID=65532
PORTBUILD_GID=65532
PARALLEL_JOBS=2
PACKAGE_FETCH_BLACKLIST="epithet*"
# Use poudriere's default FreeBSD distribution mirror.
RESOLV_CONF=/etc/resolv.conf
BASEFS=/usr/local/poudriere
POUDRIERE_DATA=/usr/local/poudriere/data
DISTFILES_CACHE=/usr/ports/distfiles

# Candidate repository policy. The publisher signs the final Epithet-only
# repository in the builder jail; the key is not mounted into poudriere build jails.
ATOMIC_PACKAGE_REPOSITORY=yes
COMMIT_PACKAGES_ON_FAILURE=no
KEEP_OLD_PACKAGES=yes
KEEP_OLD_PACKAGES_COUNT=5
PKG_REPRODUCIBLE=yes
PRESERVE_TIMESTAMP=yes
